<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password | GERAMA Admin</title>
    <link rel="icon" type="image/jpg" href="images/geramalogo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2f1f 0%, #1B5E20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .update-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .update-header {
            background: linear-gradient(135deg, #0a2f1f, #1B5E20);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .update-header img { width: 80px; margin-bottom: 1rem; border-radius: 50%; }
        .update-header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .update-header p { font-size: 0.9rem; opacity: 0.85; }
        .update-body { padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #1e2a3e; }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FFC107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
        }
        .password-hint {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.3rem;
        }
        .btn-update {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-update:hover {
            background: linear-gradient(135deg, #FFC107, #FFD54F);
            color: #1B5E20;
            transform: translateY(-2px);
        }
        .btn-update:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/env-config.js" onerror="console.warn('env-config.js not found')"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body>
    <div class="update-container">
        <div class="update-header">
            <img src="images/geramalogo.jpg" alt="GERAMA">
            <h1>Set New Password</h1>
            <p>Choose a strong password for your account</p>
        </div>
        <div class="update-body">
            <form id="updateForm">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="password" placeholder="Enter new password" required minlength="6">
                    <div class="password-hint">At least 6 characters</div>
                </div>
                
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter password" required minlength="6">
                </div>
                
                <button type="submit" class="btn-update" id="submitBtn">Update Password</button>
                
                <div id="message"></div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('updateForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validate passwords match
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            // Check if Supabase is loaded
            if (typeof window.geramaSupabase === 'undefined') {
                showMessage('Service not available. Please refresh the page.', 'error');
                return;
            }
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';
            messageEl.innerHTML = '';
            
            try {
                // Update the user's password
                const { data, error } = await window.geramaSupabase.auth.updateUser({
                    password: password
                });
                
                if (error) {
                    console.error('Update error:', error);
                    showMessage('Failed to update password. ' + error.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Update Password';
                    return;
                }
                
                showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (err) {
                console.error('Update error:', err);
                showMessage('An error occurred. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Update Password';
            }
        });

        function showMessage(text, type) {
            messageEl.className = 'message ' + type;
            messageEl.textContent = text;
        }

        // Check if user has valid session (from reset link)
        window.addEventListener('load', async () => {
            if (typeof window.geramaSupabase === 'undefined') {
                setTimeout(() => window.location.href = 'login.html', 3000);
                return;
            }
            
            const { data: { session } } = await window.geramaSupabase.auth.getSession();
            
            if (!session) {
                showMessage('Invalid or expired reset link. Redirecting...', 'error');
                setTimeout(() => window.location.href = 'reset-password.html', 2000);
            }
        });
    </script>
</body>
</html>
