<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | GERAMA Admin</title>
    <link rel="icon" type="image/jpg" href="images/geramalogo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2f1f 0%, #1B5E20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .reset-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .reset-header {
            background: linear-gradient(135deg, #0a2f1f, #1B5E20);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .reset-header img { width: 80px; margin-bottom: 1rem; border-radius: 50%; }
        .reset-header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .reset-header p { font-size: 0.9rem; opacity: 0.85; }
        .reset-body { padding: 2rem; }
        .info-box {
            background: #dbeafe;
            border-left: 4px solid #1d4ed8;
            padding: 1rem 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #1e40af;
        }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #1e2a3e; }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FFC107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
        }
        .btn-reset {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-reset:hover {
            background: linear-gradient(135deg, #FFC107, #FFD54F);
            color: #1B5E20;
            transform: translateY(-2px);
        }
        .btn-reset:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .message {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .back-link a { color: #1B5E20; text-decoration: none; font-weight: 600; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/env-config.js" onerror="console.warn('env-config.js not found')"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body>
    <div class="reset-container">
        <div class="reset-header">
            <img src="images/geramalogo.jpg" alt="GERAMA">
            <h1>Reset Password</h1>
            <p>Get your admin account back</p>
        </div>
        <div class="reset-body">
            <div class="info-box">
                <strong>📧 Password Reset Process:</strong><br>
                1. Enter your admin email below<br>
                2. We'll send you a reset link<br>
                3. Click the link to set a new password
            </div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="email" id="email" placeholder="your-admin-email@example.com" required>
                </div>
                
                <button type="submit" class="btn-reset" id="submitBtn">Send Reset Link</button>
                
                <div id="message"></div>
            </form>
            
            <div class="back-link">
                <a href="login.html">← Back to Login</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageEl = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                showMessage('Please enter your email address', 'error');
                return;
            }
            
            // Check if Supabase is loaded
            if (typeof window.geramaSupabase === 'undefined') {
                showMessage('Service not available. Please refresh the page.', 'error');
                return;
            }
            
            // Show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            messageEl.innerHTML = '';
            
            try {
                // Send password reset email
                const { data, error } = await window.geramaSupabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html'
                });
                
                if (error) {
                    console.error('Reset error:', error);
                    showMessage('Failed to send reset link. Please check your email and try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                    return;
                }
                
                showMessage('✅ Password reset link sent! Check your email inbox (and spam folder).', 'success');
                document.getElementById('email').value = '';
                
                // Keep button disabled after success
                submitBtn.textContent = 'Link Sent';
                
            } catch (err) {
                console.error('Reset error:', err);
                showMessage('An error occurred. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });

        function showMessage(text, type) {
            messageEl.className = 'message ' + type;
            messageEl.textContent = text;
        }
    </script>
</body>
</html>
