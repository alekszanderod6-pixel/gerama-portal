<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | GERAMA Portal</title>
    <link rel="icon" type="image/jpg" href="images/geramalogo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2f1f 0%, #1B5E20 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-container {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #0a2f1f, #1B5E20);
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .login-header img { width: 80px; margin-bottom: 1rem; }
        .login-header h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
        .login-header p { font-size: 0.9rem; opacity: 0.85; }
        .login-body { padding: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #1e2a3e; }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FFC107;
            box-shadow: 0 0 0 3px rgba(255,193,7,0.2);
        }
        .form-group .input-wrap { position: relative; }
        .form-group .eye-btn { position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#9ca3af;cursor:pointer;font-size:1rem;padding:0.2rem;transition:color 0.2s; }
        .form-group .eye-btn:hover { color:#1B5E20; }
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            border: none;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #FFC107, #FFD54F);
            color: #1B5E20;
            transform: translateY(-2px);
        }
        .error-message {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 0.75rem;
            text-align: center;
        }
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .signup-link a { color: #1B5E20; text-decoration: none; font-weight: 600; }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            10%,30%,50%,70%,90%{transform:translateX(-5px)}
            20%,40%,60%,80%{transform:translateX(5px)}
        }
        .shake { animation: shake 0.5s ease-in-out; }
        @media (max-width:480px){ .login-body{ padding:1.5rem; } .login-header{ padding:1.5rem; } }
    </style>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/env-config.js" onerror="console.warn('env-config.js not found')"></script>
    <script src="js/supabase-config.js"></script>
    <!-- OneSignal Web Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script src="js/onesignal-init.js" defer></script>
</head>
<body>
    <div class="login-container" id="loginCard">
        <div class="login-header">
            <img src="images/geramalogo.jpg" alt="GERAMA">
            <h1>GERAMA Portal</h1>
            <p>Access academic resources & learning materials</p>
        </div>
        <div class="login-body">
            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="username" autocomplete="off" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                      <input type="password" id="password" autocomplete="new-password" placeholder="Enter your password" required>
                      <button type="button" class="eye-btn" onclick="var i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.querySelector('i').className='fas fa-'+(i.type==='password'?'eye':'eye-slash');" title="Show/hide password"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Secret Code</label>
                    <div class="input-wrap">
                      <input type="password" id="secretCode" placeholder="Enter GERAMA secret code" required>
                      <button type="button" class="eye-btn" onclick="var i=document.getElementById('secretCode');i.type=i.type==='password'?'text':'password';this.querySelector('i').className='fas fa-'+(i.type==='password'?'eye':'eye-slash');" title="Show/hide code"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                
                <!-- Role selection removed — students log in directly -->
                
                <button type="submit" class="btn-login">Sign In</button>
                <div id="errorMsg" class="error-message"></div>
            </form>
            <div class="signup-link">
                Don't have an account? <a href="signup.html">Join GERAMA</a><br>
                <a href="#" id="forgotPasswordLink" style="color: #666; font-size: 0.85rem; margin-top: 0.5rem; display: inline-block;">Forgot Password?</a><br>
                <a href="index.html" style="color: #9ca3af; font-size: 0.82rem; margin-top: 0.5rem; display: inline-block;"><i class="fas fa-arrow-left" style="font-size:0.75rem;"></i> Back to Home</a>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email      = document.getElementById('username').value.trim();
            const password   = document.getElementById('password').value;
            const secretCode = document.getElementById('secretCode').value.trim();
            const errorMsg   = document.getElementById('errorMsg');
            const loginCard  = document.getElementById('loginCard');

            function shake(msg) {
                errorMsg.innerText = msg;
                loginCard.classList.add('shake');
                setTimeout(() => loginCard.classList.remove('shake'), 500);
            }

            // Check Supabase
            if (typeof window.geramaSupabase === 'undefined') {
                shake('Authentication service not available. Please refresh.');
                return;
            }

            // Validate secret code
            const expected = window.GERAMA_SECRET_CODE || 'GERAMA2026';
            if (secretCode !== expected) {
                shake('Invalid secret code. Please enter the correct GERAMA secret code.');
                document.getElementById('secretCode').value = '';
                return;
            }

            errorMsg.style.color = '#6b7280';
            errorMsg.innerText = 'Signing in…';

            try {
                const { data, error } = await window.geramaSupabase.auth.signInWithPassword({
                    email, password
                });

                if (error) {
                    const m = error.message.toLowerCase();
                    if (m.includes('invalid') || m.includes('credentials')) {
                        shake('Invalid email or password.');
                    } else if (m.includes('not confirmed')) {
                        shake('Email not confirmed. Check your inbox for a confirmation link.');
                    } else if (m.includes('not found')) {
                        shake('Account not found. Please sign up first.');
                    } else {
                        shake('Login failed. Please try again.');
                    }
                    errorMsg.style.color = '#dc2626';
                    document.getElementById('password').value = '';
                    return;
                }

                // Persist login state
                sessionStorage.setItem('gerama_loggedIn', 'true');
                localStorage.setItem('gerama_loggedIn', 'true');

                // Build profile from metadata + DB (non-blocking)
                const meta = data.user.user_metadata || {};
                let profileData = {
                    email,
                    name:    meta.name || email.split('@')[0],
                    program: meta.program   || 'GERAMA Member',
                    level:   meta.level     || '',
                    phone:   meta.phone     || '',
                    img:     null
                };

                // Try to fetch/upsert profile from DB
                try {
                    const { data: p } = await window.geramaSupabase
                        .from('user_profiles')
                        .select('full_name, phone, program, level, index_number, photo_url')
                        .eq('email', email)
                        .single();

                    if (p) {
                        profileData = {
                            email,
                            name:         p.full_name    || profileData.name,
                            program:      p.program      || profileData.program,
                            level:        p.level        || profileData.level,
                            phone:        p.phone        || profileData.phone,
                            index_number: p.index_number || null,
                            img:          p.photo_url    || null
                        };
                    } else {
                        // Create profile row for new user
                        await window.geramaSupabase.from('user_profiles').upsert({
                            email,
                            full_name:  profileData.name,
                            program:    profileData.program || null,
                            level:      profileData.level   || null,
                            phone:      profileData.phone   || null,
                            updated_at: new Date().toISOString()
                        }, { onConflict: 'email' });
                    }
                } catch(e) { /* non-fatal — continue with metadata */ }

                localStorage.setItem('gerama_profile', JSON.stringify(profileData));

                // Link OneSignal
                if (typeof window.geramaLinkOneSignal === 'function') {
                    window.geramaLinkOneSignal();
                }

                // Redirect to home
                window.location.href = 'index.html';

            } catch (err) {
                shake('Login failed. Please try again.');
                errorMsg.style.color = '#dc2626';
                document.getElementById('password').value = '';
                console.error('Login error:', err);
            }
        });

        // Forgot password
        document.getElementById('forgotPasswordLink').addEventListener('click', (e) => {
            e.preventDefault();
            window.location.href = 'reset-password.html';
        });

        // Banner after signup or password reset
        (function() {
            var params = new URLSearchParams(window.location.search);
            var msg = document.getElementById('errorMsg');
            if (params.get('signup') === 'success') {
                msg.style.color = '#065f46';
                msg.style.background = '#d1fae5';
                msg.style.padding = '0.6rem 1rem';
                msg.style.borderRadius = '10px';
                msg.innerText = '✅ Account created! Sign in below.';
            }
            if (params.get('reset') === 'success') {
                msg.style.color = '#065f46';
                msg.style.background = '#d1fae5';
                msg.style.padding = '0.6rem 1rem';
                msg.style.borderRadius = '10px';
                msg.innerText = '🔐 Password reset! Sign in with your new password.';
            }
        })();
    </script>
</body>
</html>
